          <g transform="translate(52, 0)"><rect width="64" height="26" rx="13" fill="#1E293B" stroke="#22D3EE" stroke-width="1.2" filter="url(#softGlow)"/><text x="32" y="16" text-anchor="middle" fill="#22D3EE" font-weight="bold">React</text></g>
