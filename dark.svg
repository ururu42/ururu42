        <animate attributeName="cy" values="180;420;180" dur="15s" repeatCount="indefinite"/>
      </circle>
      <circle r="150" fill="url(#glowEmerald)">
        <animate attributeName="cx" values="600;700;600" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="500;340;500" dur="14s" repeatCount="indefinite"/>
