<svg xmlns="http://w3.org" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://googleapis.com');
      .title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 34px; fill: #F8FAFC; }
      .subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 18px; fill: #94A3B8; }
      .term-text { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #F8FAFC; }
      .term-muted { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #64748B; }
      .term-accent { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #22D3EE; font-weight: 500; }
      .ascii-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; }
      .pill-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; fill: #E2E8F0; }
      .glow-pulse { animation: pulse 4s infinite alternate; }
      @keyframes pulse { 0% { opacity: 0.3; } 100% { opacity: 0.6; } }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animateTransform attributeName="transform" type="translate" from="-200%" to="200%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="radialBlur1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="radialBlur2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.03"/>
      <animateTransform attributeName="transform" type="translate" from="-100%" to="100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="noise" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M-1,1 l2,-2 M0,4 l4,-4 M3,5 l2,-2" stroke="rgba(255,255,255,0.015)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1180" height="610" rx="24" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="300" fill="url(#radialBlur1)" class="glow-pulse"/>
  <circle cx="950" cy="450" r="350" fill="url(#radialBlur2)" class="glow-pulse"/>
  <g opacity="0.6">
    <circle cx="150" cy="450" r="2" fill="#22D3EE"><animate attributeName="cy" values="450;430;450" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="120" r="1.5" fill="#7C3AED"><animate attributeName="cy" values="120;140;120" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="200" r="2" fill="#10B981"><animate attributeName="cy" values="200;180;200" dur="5s" repeatCount="indefinite"/></circle>
  </g>
  <rect width="1180" height="610" rx="24" fill="url(#noise)" pointer-events="none"/>
  <rect width="1176" height="606" x="2" y="2" rx="22" fill="none" stroke="url(#borderShimmer)" stroke-width="1.5"/>

  <!-- LEFT SIDE -->
  <g transform="translate(40, 40)">
    <animateTransform attributeName="transform" type="translate" values="40,40; 40,32; 40,40" dur="6s" repeatCount="indefinite"/>
    <rect width="420" height="530" rx="16" fill="#0F172A" fill-opacity="0.7" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="25" cy="25" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="41" cy="25" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="57" cy="25" r="5" fill="#10B981" opacity="0.8"/>
    <text x="210" y="28" font-family='JetBrains Mono' font-size='11' fill='#475569' text-anchor='middle'>matrix_core.sh</text>
    <line x1="15" y1="60" x2="405" y2="60" stroke="#22D3EE" stroke-width="1" opacity="0.15">
      <animate attributeName="y1" values="60;510;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="60;510;60" dur="4s" repeatCount="indefinite"/>
    </line>
    <g fill="url(#asciiGrad)" class="ascii-text">
        <text x="35" y="90" opacity="0"><animate attributeName="opacity" to="1" begin="0.1s" fill="freeze"/>▖▩▩▩▩▩▩▩▩▩▩▩▩▩▩▩▩▩▩▩▩▩▗</text>
        <text x="35" y="110" opacity="0"><animate attributeName="opacity" to="1" begin="0.2s" fill="freeze"/>▩▞▚▞▚▞▚▞▚▞▚▞▚▞▚▞▚▞▚▞▚▞▚▩</text>
        <text x="35" y="130" opacity="0"><animate attributeName="opacity" to="1" begin="0.3s" fill="freeze"/>▩   ◢◤                     ◥◣   ▩</text>
        <text x="35" y="150" opacity="0"><animate attributeName="opacity" to="1" begin="0.4s" fill="freeze"/>▩  ◢◤   ◢▆▅▄▃    ▃▄▅▆◣   ◥◣  ▩</text>
        <text x="35" y="170" opacity="0"><animate attributeName="opacity" to="1" begin="0.5s" fill="freeze"/>▩ ◢◤   ◢◤    ◥◣  ◢◤    ◥◣   ◥◣ ▩</text>
        <text x="35" y="190" opacity="0"><animate attributeName="opacity" to="1" begin="0.6s" fill="freeze"/>▩ ▩    ▩  ★  ▩  ▩  ★  ▩    ▩ ▩</text>
        <text x="35" y="210" opacity="0"><animate attributeName="opacity" to="1" begin="0.7s" fill="freeze"/>▩ ◥◣   ◥◣    ◢◤  ◥◣    ◢◤   ◢◤ ▩</text>
        <text x="35" y="230" opacity="0"><animate attributeName="opacity" to="1" begin="0.8s" fill="freeze"/>▩  ◥◣   ◥▆▅▄▃◤    ◥▃▄▅▆◤   ◢◤  ▩</text>
        <text x="35" y="250" opacity="0"><animate attributeName="opacity" to="1" begin="0.9s" fill="freeze"/>▩   ◥◣                     ◢◤   ▩</text>
        <text x="35" y="270" opacity="0"><animate attributeName="opacity" to="1" begin="1.0s" fill="freeze"/>▩     ▩  ◢███████████◣  ▩     ▩</text>
        <text x="35" y="290" opacity="0"><animate attributeName="opacity" to="1" begin="1.1s" fill="freeze"/>▩     ▩  ◥███████████◤  ▩     ▩</text>
        <text x="35" y="310" opacity="0"><animate attributeName="opacity" to="1" begin="1.2s" fill="freeze"/>▩   ◢◤                     ◥◣   ▩</text>
        <text x="35" y="330" opacity="0"><animate attributeName="opacity" to="1" begin="1.3s" fill="freeze"/>▩  ◢◤   ▰▰▰▰▰▰▰▰▰▰▰▰▰   ◥◣  ▩</text>
        <text x="35" y="350" opacity="0"><animate attributeName="opacity" to="1" begin="1.4s" fill="freeze"/>▩ ◢◤    ▚▞▚▞▚▞▚▞▚▞▚▞▚    ◥◣ ▩</text>
        <text x="35" y="370" opacity="0"><animate attributeName="opacity" to="1" begin="1.5s" fill="freeze"/>▩ ▩     🔥 INITIALIZING 🔥     ▩ ▩</text>
        <text x="35" y="390" opacity="0"><animate attributeName="opacity" to="1" begin="1.6s" fill="freeze"/>▩ ◥◣    ▚▞▚▞▚▞▚▞▚▞▚▞▚    ◢◤ ▩</text>
        <text x="35" y="410" opacity="0"><animate attributeName="opacity" to="1" begin="1.7s" fill="freeze"/>▩  ◥◣   ▰▰▰▰▰▰▰▰▰▰▰▰▰   ◢◤  ▩</text>
        <text x="35" y="430" opacity="0"><animate attributeName="opacity" to="1" begin="1.8s" fill="freeze"/>▩   ◥◣                     ◢◤   ▩</text>
        <text x="35" y="450" opacity="0"><animate attributeName="opacity" to="1" begin="1.9s" fill="freeze"/>▩▞▚▞▚▞▚▞▚▞▚▞▚▞▚▞▚▞▚▞▚▞▚▞▚▩</text>
        <text x="35" y="470" opacity="0"><animate attributeName="opacity" to="1" begin="2.0s" fill="freeze"/>▝▩▩▩▩▩▩▩▩▩▩▩▩▩▩▩▩▩▩▩▩▩▘</text>
    </g>
    <text x="35" y="505" class="term-muted">&gt; Ready: </text>
    <text x="100" y="505" class="term-accent">SYSTEM_ACTIVE</text>
    <rect x="210" y="493" width="8" height="14" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- RIGHT SIDE -->
  <g transform="translate(490, 40)">
    <g transform="translate(0, 30)">
      <text x="0" y="0" class="subtitle">Hi 👋</text>
      <text x="0" y="40" class="title">I'm Katerinas Maltceva</text>
    </g>

    <g transform="translate(0, 115)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="url(#accentGrad)">
        <animate attributeName="string" values="Full Stack Developer;React Specialist;SaaS Builder;Open Source Contributor" dur="12s" repeatCount="indefinite"/>
      </text>
      <rect x="260" y="-18" width="10" height="22" fill="#10B981">
        <animate attributeName="x" values="240;270;220;280" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(0, 160)">
      <g opacity="0"><animate attributeName="opacity" to="1" begin="0.5s" fill="freeze"/>
        <text x="0" y="20" class="term-muted">📍 Location:</text>
        <text x="130" y="20" class="term-text">Moscow, Russian</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" to="1" begin="0.8s" fill="freeze"/>
        <text x="0" y="45" class="term-muted">🎓 Education:</text>
        <text x="130" y="45" class="term-text">Self-taught + Result University</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" to="1" begin="1.1s" fill="freeze"/>
