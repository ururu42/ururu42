<svg xmlns="http://w3.org" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://googleapis.com');
      .title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 34px; fill: #0F172A; }
      .subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 18px; fill: #475569; }
      .term-text { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #0F172A; }
      .term-muted { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #64748B; }
      .term-accent { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #2563EB; font-weight: 500; }
      .ascii-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; }
      .pill-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; fill: #334155; }
      .glow-pulse { animation: pulse 4s infinite alternate; }
      @keyframes pulse { 0% { opacity: 0.15; } 100% { opacity: 0.35; } }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animateTransform attributeName="transform" type="translate" from="-200%" to="200%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="radialBlur1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="radialBlur2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
