      <rect x="470" y="70" width="672" height="46" rx="18" fill="#F1F5F9" fill-opacity="0.95"/>
      <circle cx="496" cy="93" r="5" fill="#ef4444"/><circle cx="516" cy="93" r="5" fill="#eab308"/><circle cx="536" cy="93" r="5" fill="#22c55e"/>
      <text x="806" y="97" fill="#475569" font-size="12" text-anchor="middle" letter-spacing="1">katerina — zsh</text>

      <text x="504" y="158" fill="#0F172A" font-size="26" font-weight="700">Hi <tspan font-size="24">👋</tspan> I'm <tspan fill="url(#accent)">Katerina Maltceva</tspan></text>

      <g font-size="17">
        <text x="504" y="192" fill="#475569">$ role:</text>
        <g>
