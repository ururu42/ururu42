            <tspan>Building SaaS · web</tspan>
            <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.9;1" dur="4s" begin="8s" fill="freeze"/>
          </text>
        </g>
      </g>
      <rect x="566" y="180" width="8" height="15" fill="#06B6D4">
        <animate attributeName="opacity" values="1;0" dur="0.8s" repeatCount="indefinite"/>
      </rect>

      <g font-size="14" fill="#475569">
        <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
          <text x="504" y="230"><tspan fill="#2563EB">📍 Location</tspan>   <tspan fill="#0F172A">Moscow, Russian</tspan></text></g>
        <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.9s" fill="freeze"/>
          <text x="504" y="256"><tspan fill="#06B6D4">🎓 Education</tspan>  <tspan fill="#0F172A">Самообучение + Result University</tspan></text></g>
        <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
          <text x="504" y="282"><tspan fill="#10B981">⚡ Focus</tspan>      <tspan fill="#0F172A">React, JS, Nodejs, Building SaaS, web</tspan></text></g>
        <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.5s" fill="freeze"/>
          <text x="504" y="308"><tspan fill="#2563EB">🌐 Website</tspan>   <tspan fill="#0F172A">https://onrender.com</tspan></text></g>
        <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
          <text x="504" y="334"><tspan fill="#06B6D4">✉️ Email</tspan>   <tspan fill="#0F172A">katerina.maltceva.dev@gmail.com</tspan></text></g>
      </g>

      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.0s" fill="freeze"/>
        <text x="504" y="344" fill="#94A3B8" font-size="12" letter-spacing="2">SKILLS</text>
        <g font-size="12.5" fill="#0F172A" text-anchor="middle">
          <g><rect x="504" y="354" width="104" height="26" rx="13" fill="url(#pillGrad)" stroke="#06B6D4" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/></rect><text x="556" y="371">JavaScript</text></g>
          <g><rect x="624" y="354" width="86" height="26" rx="13" fill="url(#pillGrad)" stroke="#2563EB" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.3s" repeatCount="indefinite"/></rect><text x="667" y="371">React</text></g>
          <g><rect x="708" y="354" width="112" height="26" rx="13" fill="url(#pillGrad)" stroke="#10B981" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="2.8s" repeatCount="indefinite"/></rect><text x="764" y="371">Redux Toolkit</text></g>
          <g><rect x="824" y="354" width="96" height="26" rx="13" fill="url(#pillGrad)" stroke="#06B6D4" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.1s" repeatCount="indefinite"/></rect><text x="872" y="371">Zustand</text></g>
          <g><rect x="504" y="388" width="80" height="26" rx="13" fill="url(#pillGrad)" stroke="#2563EB" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="2.6s" repeatCount="indefinite"/></rect><text x="544" y="405">Node.js</text></g>
          <g><rect x="592" y="388" width="90" height="26" rx="13" fill="url(#pillGrad)" stroke="#10B981" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.4s" repeatCount="indefinite"/></rect><text x="637" y="405">TypeScript</text></g>
          <g><rect x="688" y="388" width="74" height="26" rx="13" fill="url(#pillGrad)" stroke="#06B6D4" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="2.9s" repeatCount="indefinite"/></rect><text x="725" y="405">Tailwind</text></g>
          <g><rect x="772" y="388" width="82" height="26" rx="13" fill="url(#pillGrad)" stroke="#2563EB" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.2s" repeatCount="indefinite"/></rect><text x="813" y="405">Docker</text></g>
          <g><rect x="504" y="422" width="82" height="26" rx="13" fill="url(#pillGrad)" stroke="#10B981" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="2.7s" repeatCount="indefinite"/></rect><text x="545" y="439">MongoDB</text></g>
          <g><rect x="594" y="422" width="46" height="26" rx="13" fill="url(#pillGrad)" stroke="#06B6D4" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/></rect><text x="617" y="439">Git</text></g>
          <g><rect x="643" y="422" width="64" height="26" rx="13" fill="url(#pillGrad)" stroke="#2563EB" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/></rect><text x="675" y="439">Figma</text></g>
          <g><rect x="718" y="422" width="56" height="26" rx="13" fill="url(#pillGrad)" stroke="#10B981" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.1s" repeatCount="indefinite"/></rect><text x="746" y="439">HTML</text></g>
          <g><rect x="784" y="422" width="52" height="26" rx="13" fill="url(#pillGrad)" stroke="#06B6D4" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="2.8s" repeatCount="indefinite"/></rect><text x="810" y="439">CSS</text></g>
          <g><rect x="846" y="422" width="90" height="26" rx="13" fill="url(#pillGrad)" stroke="#2563EB" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.1s" repeatCount="indefinite"/></rect><text x="891" y="439">styledComponents</text></g>
          <g><rect x="504" y="456" width="56" height="26" rx="13" fill="url(#pillGrad)" stroke="#10B981" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/></rect><text x="532" y="473">Vite</text></g>
