  <circle cx="950" cy="450" r="350" fill="url(#radialBlur2)" class="glow-pulse"/>
  <rect width="1176" height="606" x="2" y="2" rx="22" fill="none" stroke="rgba(15,23,42,0.08)" stroke-width="1.5"/>

